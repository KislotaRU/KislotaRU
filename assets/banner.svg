<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">KislotaRU — C# / Unity Developer</title>
  <desc id="description">Минималистичный тёмный баннер с кислотно-зелёными акцентами</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#151B23"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9FEF00" stroke-width="1" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <circle cx="1080" cy="62" r="92" fill="#9FEF00" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1080" cy="62" r="44" fill="none" stroke="#9FEF00" stroke-width="2" opacity="0.45"/>
  <circle cx="1080" cy="62" r="8" fill="#9FEF00"/>

  <rect x="72" y="68" width="6" height="184" rx="3" fill="#9FEF00"/>

  <text x="108" y="148" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="1">KislotaRU</text>
  <text x="111" y="198" fill="#9FEF00" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3">C# / UNITY DEVELOPER</text>
  <text x="111" y="239" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="20">Создаю видеоигры.</text>

  <path d="M1008 254h112" stroke="#30363D" stroke-width="2"/>
  <path d="M1080 238v32" stroke="#9FEF00" stroke-width="2"/>
</svg>
